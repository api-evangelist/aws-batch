aid: aws-batch
name: AWS Batch
description: >-
  AWS Batch is a fully managed batch computing service that enables
  developers, scientists, and engineers to run hundreds of thousands of
  batch and machine learning compute jobs efficiently on AWS by dynamically
  provisioning the optimal quantity and type of compute resources based on
  job volume and resource requirements. The AWS Batch API provides
  programmatic management of compute environments, job queues, job
  definitions, scheduling policies, and job submission and lifecycle
  operations, authenticated with AWS Signature Version 4 (SigV4).
