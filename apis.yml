    description: >-
      REST API for managing AWS Batch compute environments, job queues,
      job definitions, scheduling policies, consumable resources, and jobs.
      Operations are exposed as POST endpoints under /v1/ paths with JSON
      request and response bodies and are authenticated using AWS Signature
      Version 4 (SigV4).
